<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Was koche ich heute? - Rezeptfinder</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rezeptfinder">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pinterest.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/chrome-ios.css">
    <link rel="stylesheet" href="css/recipe-editor.css">
    
    <!-- Custom Scripts -->
    <script type="module" src="js/recipeGenerator.mjs"></script>
</head>
<body>
    <div class="container">
        <!-- Pinterest Header -->
        <div class="pinterest-header">
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Suche Rezepte..."
                    autocomplete="off"
                />
                <button id="shuffleBtn" class="secondary-btn shuffle-btn" title="Reihenfolge mischen">
                    <span class="btn-icon">🔀</span>
                    <span class="btn-text">Mischen</span>
                </button>
                <button id="uploadRecipesBtn" class="primary-btn upload-btn" title="Rezepte neu laden">
                    <span class="btn-icon">📂</span>
                    <span class="btn-text">Aktualisieren</span>
                </button>
                <button id="openEditorBtn" class="secondary-btn recipe-editor-btn" title="Rezepte bearbeiten" aria-label="Rezepte bearbeiten"><span class="recipe-editor-icon">✏️</span><span class="recipe-editor-text">Bearbeiten</span></button>
                <div class="category-filter" id="categoryFilter" style="display: none;">
                    <button id="categoryChipAll" class="category-chip active" data-category="Alle">
                        Alle
                    </button>
                </div>
            </div>
        </div>

        <!-- Masonry Grid -->
        <div id="masonryGrid" class="masonry-grid"></div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">Lade Rezepte...</div>
        <div id="uploadOverlay" class="upload-overlay" style="display: none;">
            <div class="upload-card">
                <h1>🍳 Was koche ich heute?</h1>
                <p>Wähle deine <strong>recipes.json</strong>, um die Rezepte zu laden.</p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label for="recipesJsonInput" class="file-label">📂 Datei auswählen</label>
                    <button type="button" id="loadDefaultRecipesBtn" class="file-label" title="Repository-Datei laden">
                        🔄 Standard-Datei laden
                    </button>
                    <button type="button" id="closeUploadOverlayBtn" class="file-label file-label-back" title="Zurück">
                        <span class="back-arrow">←</span> Zurück
                    </button>
                </div>
                <input type="file" id="recipesJsonInput" accept=".json,application/json">
                <div id="uploadStatus" class="upload-status" role="status" aria-live="polite"></div>
            </div>
        </div>

    </div>

    <div id="recipeEditor" class="editor-overlay" hidden>
        <section class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
            <header class="editor-header">
                <div><h2 id="editorTitle">Rezepte bearbeiten</h2><p id="editorSaveStatus" class="editor-status" role="status" aria-live="polite" aria-atomic="true">Änderungen werden auf diesem Gerät gespeichert.</p></div>
                <button type="button" id="editorCloseBtn" class="editor-close" aria-label="Schließen">✕</button>
            </header>
            <div class="editor-toolbar">
                <input id="editorSearch" type="search" placeholder="Rezept suchen…" aria-label="Rezept suchen">
                <button type="button" class="secondary-btn" id="recipeImportUrlBtn" data-local-recipe-import hidden>URL importieren</button>
                <button type="button" class="secondary-btn" id="recipeImportImageBtn" data-local-recipe-import hidden>Bild importieren</button>
                <button type="button" id="newRecipeBtn" class="primary-btn">＋ Neues Rezept</button>
                <input id="recipeImportImageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
            <div class="editor-layout">
                <nav id="editorRecipeList" class="editor-recipe-list" aria-label="Rezeptliste"></nav>
                <form id="recipeEditForm" class="recipe-edit-form">
                    <p class="editor-empty">Wähle ein Rezept aus oder lege ein neues an.</p>
                </form>
            </div>
        </section>
    </div>

    <script type="module" src="js/indexPage.mjs"></script>
    <script type="module" src="js/recipeEditor.mjs"></script>

    <style>
        .upload-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            z-index: 10000;
        }

        .upload-card {
            position: relative;
            height: fit-content;
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .upload-card h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .upload-card p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .upload-status {
            margin-top: 20px;
        }

        .upload-status .error {
            color: #d32f2f;
            padding: 15px;
            background: #ffebee;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
        }

        .upload-status .success {
            color: #388e3c;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #388e3c;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 8px 14px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            background: #667eea;
            color: white;
            border: none;
            width: 100%;
            text-align: center;
        }

        .file-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-label-back {
            background: #6c757d;
        }

        .file-label-back:hover {
            background: #5a6268;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .progress-container {
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .progress-text {
            color: #666;
            font-size: 0.9em;
        }

        /* Category Filter Styles */
        .category-filter {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            min-width: 0;
            padding: 8px 0 0;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f0f0f0;
        }

        .category-filter::-webkit-scrollbar {
            height: 6px;
        }

        .category-filter::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .category-filter::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .category-chip {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .category-chip:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .category-chip.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .recipe-category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .recipe-placeholder-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(255, 193, 7, 0.1);
            color: #ff9800;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* Mobile Styles für Upload Overlay */
        @media (max-width: 576px) {
            .upload-card {
                padding: 40px 30px;
                margin: 20px;
            }

            .upload-card h1 {
                font-size: 1.8em;
                margin-top: 30px;
            }

            .upload-card p {
                font-size: 1em;
            }
        }
    </style>
</body>
</html>
