<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Was koche ich heute? - Rezeptfinder</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rezeptfinder">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pinterest.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/chrome-ios.css">
    <link rel="stylesheet" href="css/recipe-editor.css">
    <link rel="stylesheet" href="css/index.css">
    
    <!-- Custom Scripts -->
    <script type="module" src="js/recipeGenerator.mjs"></script>
</head>
<body>
    <div class="container">
        <!-- Pinterest Header -->
        <div class="pinterest-header">
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Suche Rezepte..."
                    autocomplete="off"
                />
                <button id="shuffleBtn" class="secondary-btn shuffle-btn" title="Reihenfolge mischen">
                    <span class="btn-icon">🔀</span>
                    <span class="btn-text">Mischen</span>
                </button>
                <button id="uploadRecipesBtn" class="primary-btn upload-btn" title="Rezepte neu laden">
                    <span class="btn-icon">📂</span>
                    <span class="btn-text">Aktualisieren</span>
                </button>
                <button id="openEditorBtn" class="secondary-btn recipe-editor-btn" title="Rezepte bearbeiten" aria-label="Rezepte bearbeiten"><span class="recipe-editor-icon">✏️</span><span class="recipe-editor-text">Bearbeiten</span></button>
                <div class="category-filter is-hidden" id="categoryFilter">
                    <button id="categoryChipAll" class="category-chip active" data-category="Alle">
                        Alle
                    </button>
                </div>
            </div>
        </div>

        <!-- Masonry Grid -->
        <div id="masonryGrid" class="masonry-grid"></div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">Lade Rezepte...</div>
    </div>

    <div id="uploadOverlay" class="upload-overlay is-hidden">
        <div class="upload-card">
            <h1>🍳 Was koche ich heute?</h1>
            <p>Wähle deine <strong>recipes.json</strong>, um die Rezepte zu laden.</p>
            <div class="upload-overlay-actions">
                <label for="recipesJsonInput" class="file-label">📂 Datei auswählen</label>
                <button type="button" id="loadDefaultRecipesBtn" class="file-label" title="Repository-Datei laden">
                    🔄 Standard-Datei laden
                </button>
                <button type="button" id="closeUploadOverlayBtn" class="file-label file-label-back" title="Zurück">
                    <span class="back-arrow">←</span> Zurück
                </button>
            </div>
            <input type="file" id="recipesJsonInput" accept=".json,application/json">
            <div id="uploadStatus" class="upload-status" role="status" aria-live="polite"></div>
        </div>
    </div>

    <div id="recipeEditor" class="editor-overlay" hidden>
        <section class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
            <header class="editor-header">
                <div><h2 id="editorTitle">Rezepte bearbeiten</h2><p id="editorSaveStatus" class="editor-status" role="status" aria-live="polite" aria-atomic="true">Änderungen werden auf diesem Gerät gespeichert.</p></div>
                <button type="button" id="editorCloseBtn" class="editor-close" aria-label="Schließen">✕</button>
            </header>
            <div class="editor-toolbar">
                <input id="editorSearch" type="search" placeholder="Rezept suchen…" aria-label="Rezept suchen">
                <button type="button" class="secondary-btn" id="recipeImportUrlBtn" data-local-recipe-import hidden>URL importieren</button>
                <button type="button" class="secondary-btn" id="recipeImportImageBtn" data-local-recipe-import hidden>Bild importieren</button>
                <button type="button" id="newRecipeBtn" class="primary-btn">＋ Neues Rezept</button>
                <input id="recipeImportImageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
            <div class="editor-layout">
                <nav id="editorRecipeList" class="editor-recipe-list" aria-label="Rezeptliste"></nav>
                <form id="recipeEditForm" class="recipe-edit-form">
                    <p class="editor-empty">Wähle ein Rezept aus oder lege ein neues an.</p>
                </form>
            </div>
        </section>
    </div>

    <script type="module" src="js/indexPage.mjs"></script>
    <script type="module" src="js/recipeEditor.mjs"></script>

</body>
</html>
