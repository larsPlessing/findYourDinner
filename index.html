<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Was koche ich heute? - Rezeptfinder</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rezeptfinder">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pinterest.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/chrome-ios.css">
    <link rel="stylesheet" href="css/recipe-editor.css">
    
    <!-- Custom Scripts -->
    <script src="js/recipeGenerator.js"></script>
</head>
<body>
    <div class="container">
        <!-- Pinterest Header -->
        <div class="pinterest-header">
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Suche Rezepte..."
                    autocomplete="off"
                />
                <button class="secondary-btn shuffle-btn" onclick="shuffleRecipes()" title="Reihenfolge mischen">
                    <span class="btn-icon">🔀</span>
                    <span class="btn-text">Mischen</span>
                </button>
                <button class="primary-btn upload-btn" onclick="showUploadDialog()" title="Rezepte neu laden">
                    <span class="btn-icon">📂</span>
                    <span class="btn-text">Aktualisieren</span>
                </button>
                <button class="secondary-btn recipe-editor-btn" onclick="openRecipeEditor()" title="Rezepte bearbeiten" aria-label="Rezepte bearbeiten"><span class="recipe-editor-icon">✏️</span><span class="recipe-editor-text">Bearbeiten</span></button>
            </div>
            
            <!-- Category Filter -->
            <div class="category-filter" id="categoryFilter" style="display: none;">
                <button class="category-chip active" data-category="Alle" onclick="filterByCategory('Alle')">
                    Alle
                </button>
            </div>
        </div>

        <!-- Masonry Grid -->
        <div id="masonryGrid" class="masonry-grid"></div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">Lade Rezepte...</div>
        <div id="uploadOverlay" class="upload-overlay" style="display: none;">
            <div class="upload-card">
                <h1>🍳 Was koche ich heute?</h1>
                <p>Wähle deine <strong>recipes.json</strong>, um die Rezepte zu laden.</p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label for="recipesJsonInput" class="file-label">📂 Datei auswählen</label>
                    <button type="button" class="file-label" onclick="loadDefaultRecipes()" title="Repository-Datei laden">
                        🔄 Standard-Datei laden
                    </button>
                    <button type="button" class="file-label file-label-back" onclick="closeUploadOverlay()" title="Zurück">
                        <span class="back-arrow">←</span> Zurück
                    </button>
                </div>
                <input type="file" id="recipesJsonInput" accept=".json,application/json">
                <div id="uploadStatus" class="upload-status" role="status" aria-live="polite"></div>
            </div>
        </div>

        <!-- Random FAB -->
        <button class="random-fab" onclick="selectRandomRecipe()" title="Zufälliges Rezept">
            🎲
        </button>
    </div>

    <div id="recipeEditor" class="editor-overlay" hidden>
        <section class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
            <header class="editor-header">
                <div><h2 id="editorTitle">Rezepte bearbeiten</h2><p id="editorSaveStatus">Änderungen werden auf diesem Gerät gespeichert.</p></div>
                <button type="button" class="editor-close" onclick="closeRecipeEditor()" aria-label="Schließen">✕</button>
            </header>
            <div class="editor-toolbar">
                <input id="editorSearch" type="search" placeholder="Rezept suchen…" aria-label="Rezept suchen">
                <button type="button" class="primary-btn" onclick="newRecipe()">＋ Neues Rezept</button>
            </div>
            <div class="editor-layout">
                <nav id="editorRecipeList" class="editor-recipe-list" aria-label="Rezeptliste"></nav>
                <form id="recipeEditForm" class="recipe-edit-form">
                    <p class="editor-empty">Wähle ein Rezept aus oder lege ein neues an.</p>
                </form>
            </div>
        </section>
    </div>

    <script>
        const generator = new RecipeGenerator();
        let allRecipes = [];
        let filteredRecipes = [];
        let currentCategory = 'Mittagessen - Salzig';

        const searchInput = document.getElementById('searchInput');
        const masonryGrid = document.getElementById('masonryGrid');
        const loadingState = document.getElementById('loadingState');
        const categoryFilter = document.getElementById('categoryFilter');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const recipesJsonInput = document.getElementById('recipesJsonInput');
        const uploadStatus = document.getElementById('uploadStatus');

        searchInput.addEventListener('input', handleSearch);
        recipesJsonInput.addEventListener('change', handleLocalJsonFile);

        window.addEventListener('load', loadRecipes);

        async function loadRecipes(forceRemote = false) {
            try {
                loadingState.textContent = 'Lade Rezepte...';
                if (forceRemote) localStorage.removeItem('recipes_user_edits');
                const savedRecipes = forceRemote ? null : localStorage.getItem('recipes_user_edits');
                if (savedRecipes) {
                    const parsed = JSON.parse(savedRecipes);
                    if (!Array.isArray(parsed)) throw new Error('Lokal gespeicherte Rezeptdaten sind ungültig.');
                    generator.recipes = parsed;
                    generator.hasImages = parsed.some(recipe => recipe.images && recipe.images.length);
                } else if (!forceRemote && generator.loadFromLocalStorage()) {
                    generator.hasImages = generator.recipes.some(recipe => recipe.images && recipe.images.length);
                } else {
                    await generator.loadFromURL('recipes.json');
                    generator.saveToLocalStorage();
                }
                allRecipes = generator.getAllRecipes();
                filteredRecipes = [...allRecipes];
                initializeCategoryFilter();
                applyFilters('', currentCategory);
                uploadOverlay.style.display = 'none';
                uploadStatus.textContent = '';
                uploadStatus.classList.remove('error');
            } catch (error) {
                loadingState.style.display = 'none';
                showUploadDialog();
                uploadStatus.textContent = `Rezepte konnten nicht automatisch geladen werden: ${error.message}`;
                uploadStatus.classList.add('error');
            }
        }

        async function loadRecipesFile(file) {
            const data = JSON.parse(await file.text());
            if (!Array.isArray(data.recipes)) throw new Error('Die Datei enthält keine Rezeptliste.');
            generator.recipes = data.recipes;
            generator.hasImages = data.recipes.some(recipe => recipe.images && recipe.images.length > 0);
            localStorage.setItem('recipes_user_edits', JSON.stringify(data.recipes));
            generator.saveToLocalStorage();
            allRecipes = generator.getAllRecipes();
            filteredRecipes = [...allRecipes];
            uploadOverlay.style.display = 'none';
            uploadStatus.textContent = '';
            loadingState.style.display = 'none';
            initializeCategoryFilter();
            applyFilters('', currentCategory);
        }

        async function handleLocalJsonFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                if (!file.name.toLowerCase().endsWith('.json')) throw new Error('Bitte eine JSON-Datei auswählen.');
                await loadRecipesFile(file);
            } catch (error) {
                uploadStatus.textContent = `JSON-Datei konnte nicht geladen werden: ${error.message}`;
                uploadStatus.classList.add('error');
            }
        }

        function showUploadDialog() {
            uploadStatus.textContent = '';
            uploadStatus.classList.remove('error');
            uploadOverlay.style.display = 'flex';
        }

        function closeUploadOverlay() {
            uploadOverlay.style.display = 'none';
            if (allRecipes.length > 0) displayRecipes();
        }

        async function loadDefaultRecipes() {
            uploadStatus.textContent = '';
            uploadStatus.classList.remove('error');
            try {
                await loadRecipes(true);
                if (allRecipes.length === 0) uploadOverlay.style.display = 'flex';
            } catch (error) {
                uploadStatus.textContent = `Rezepte konnten nicht geladen werden: ${error.message}`;
                uploadStatus.classList.add('error');
            }
        }

        async function displayRecipes() {
            loadingState.style.display = 'none';
            masonryGrid.innerHTML = '';

            if (filteredRecipes.length === 0) {
                masonryGrid.innerHTML = '<div class="no-results">Keine Rezepte gefunden</div>';
                return;
            }

            // Zeige zunächst Platzhalter
            const fragment = document.createDocumentFragment();
            
            for (let index = 0; index < filteredRecipes.length; index++) {
                const recipe = filteredRecipes[index];
                const item = document.createElement('div');
                item.className = 'masonry-item';
                item.dataset.recipeName = recipe.name;

                const emoji = getRecipeEmoji(recipe.name);
                const gradient = `gradient-${(index % 8) + 1}`;
                const heightClass = getRandomHeight(recipe.name);

                item.innerHTML = `
                    <div class="recipe-pin" onclick="openRecipe('${recipe.name.replace(/'/g, "\\'")}')">
                        <div class="recipe-pin-image ${gradient} ${heightClass}" data-recipe="${recipe.name}">
                            ${emoji}
                        </div>
                        <div class="recipe-pin-content">
                            <div class="recipe-pin-title">${recipe.name}</div>
                            ${recipe.category ? `<div class="recipe-category-badge">${recipe.category}</div>` : ''}
                            ${recipe.isPlaceholder ? `<div class="recipe-placeholder-badge">⏳ In Vorbereitung</div>` : ''}
                            <div class="recipe-pin-info">
                                ${recipe.servings ? `<div class="recipe-pin-info-item">👥 ${recipe.servings} Portionen</div>` : ''}
                                ${recipe.ingredients && !recipe.isPlaceholder ? `<div class="recipe-pin-info-item">📝 ${recipe.ingredients.length} Zutaten</div>` : ''}
                            </div>
                        </div>
                        <div class="recipe-pin-overlay">
                            <button>Rezept ansehen</button>
                        </div>
                    </div>
                `;

                fragment.appendChild(item);
            }
            
            masonryGrid.appendChild(fragment);

            // Lade echte Bilder asynchron
            loadRecipeImages();
        }

        async function loadRecipeImages() {
            // Chrome iOS optimization: Load images in batches with IntersectionObserver
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const imageEl = entry.target;
                        const recipeName = imageEl.dataset.recipe;
                        loadSingleRecipeImage(recipeName, imageEl);
                        observer.unobserve(imageEl);
                    }
                });
            }, {
                root: null,
                rootMargin: '50px', // Start loading 50px before visible
                threshold: 0.01
            });
            
            // Observe all recipe images
            const recipeImages = document.querySelectorAll('[data-recipe]');
            recipeImages.forEach(img => observer.observe(img));
        }
        
        async function loadSingleRecipeImage(recipeName, imageEl) {
            try {
                const imageData = await generator.getRecipeImageURL(recipeName);
                const recipe = filteredRecipes.find(r => r.name === recipeName);
                
                if (!imageEl || !recipe) return;
                
                if (imageData && imageData.dataUrl) {
                    // Verwende echtes Bild mit Transformationen
                    const img = document.createElement('img');
                    img.src = imageData.dataUrl;
                    img.alt = recipe.name;
                    img.loading = 'lazy';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    
                    // Wende Transformationen an
                    applyImageTransform(img, imageData.transform);
                    
                    imageEl.innerHTML = '';
                    imageEl.appendChild(img);
                    imageEl.classList.remove('gradient-1', 'gradient-2', 'gradient-3', 'gradient-4', 'gradient-5', 'gradient-6', 'gradient-7', 'gradient-8');
                } else {
                    // Generiere Placeholder
                    const placeholder = generatePlaceholderImage(recipe.name, getRecipeEmoji(recipe.name));
                    const img = document.createElement('img');
                    img.src = placeholder;
                    img.alt = recipe.name;
                    img.loading = 'lazy';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    
                    imageEl.innerHTML = '';
                    imageEl.appendChild(img);
                }
            } catch (error) {
                console.warn(`Bild für ${recipeName} konnte nicht geladen werden:`, error);
            }
        }

        /**
         * Wendet CSS-Transformationen auf ein Bild-Element an
         * @param {HTMLImageElement} imgElement - Das Bild-Element
         * @param {Object} transform - Transformations-Objekt
         */
        function applyImageTransform(imgElement, transform) {
            if (!transform) return;
            
            const transforms = [];
            
            // Rotation
            if (transform.rotation && transform.rotation !== 0) {
                transforms.push(`rotate(${transform.rotation}deg)`);
            }
            
            // Spiegelung
            let scaleX = transform.flipH ? -1 : 1;
            let scaleY = transform.flipV ? -1 : 1;
            if (scaleX !== 1 || scaleY !== 1) {
                transforms.push(`scale(${scaleX}, ${scaleY})`);
            }
            
            // CSS Transform anwenden
            if (transforms.length > 0) {
                imgElement.style.transform = transforms.join(' ');
            }
            
            // Cropping mit clip-path
            if (transform.crop && (transform.crop.left > 0 || transform.crop.top > 0 || 
                transform.crop.right > 0 || transform.crop.bottom > 0)) {
                
                const left = transform.crop.left;
                const top = transform.crop.top;
                const right = 100 - transform.crop.right;
                const bottom = 100 - transform.crop.bottom;
                
                // Verwende object-position für Cropping-Effekt
                imgElement.style.clipPath = `inset(${top}% ${100-right}% ${100-bottom}% ${left}%)`;
            }
        }

        function generatePlaceholderImage(recipeName, emoji) {
            // Erstelle SVG Placeholder mit Emoji und Rezeptname
            const hash = recipeName.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const gradients = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%)'
            ];
            
            const colors = [
                ['#667eea', '#764ba2'],
                ['#f093fb', '#f5576c'],
                ['#4facfe', '#00f2fe'],
                ['#43e97b', '#38f9d7'],
                ['#fa709a', '#fee140'],
                ['#30cfd0', '#330867'],
                ['#a8edea', '#fed6e3'],
                ['#ff9a56', '#ff6a88']
            ];
            
            const colorPair = colors[hash % colors.length];
            const displayName = recipeName.length > 25 ? recipeName.substring(0, 22) + '...' : recipeName;
            
            const svg = `
                <svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad${hash}" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:${colorPair[0]};stop-opacity:1" />
                            <stop offset="100%" style="stop-color:${colorPair[1]};stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="400" height="400" fill="url(#grad${hash})"/>
                    <text x="200" y="180" font-size="120" text-anchor="middle" fill="white" opacity="0.9">${emoji}</text>
                    <text x="200" y="280" font-size="24" text-anchor="middle" fill="white" font-weight="600" opacity="0.95">${displayName}</text>
                </svg>
            `;
            
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function getRecipeEmoji(recipeName) {
            const name = recipeName.toLowerCase();
            
            if (name.includes('pizza')) return '🍕';
            if (name.includes('burger')) return '🍔';
            if (name.includes('pasta') || name.includes('nudel')) return '🍝';
            if (name.includes('salat')) return '🥗';
            if (name.includes('suppe')) return '🍲';
            if (name.includes('kuchen') || name.includes('torte')) return '🍰';
            if (name.includes('brot')) return '🍞';
            if (name.includes('hähnchen') || name.includes('chicken')) return '🍗';
            if (name.includes('fisch')) return '🐟';
            if (name.includes('reis')) return '🍚';
            if (name.includes('curry')) return '🍛';
            if (name.includes('sandwich') || name.includes('subway')) return '🥪';
            if (name.includes('taco')) return '🌮';
            if (name.includes('sushi')) return '🍣';
            if (name.includes('steak')) return '🥩';
            if (name.includes('ei')) return '🍳';
            if (name.includes('auflauf')) return '🥘';
            if (name.includes('dessert') || name.includes('nachtisch')) return '🍮';
            if (name.includes('kartoffel')) return '🥔';
            if (name.includes('pute')) return '🦃';
            if (name.includes('gnocchi')) return '🥟';
            if (name.includes('nacho')) return '🌮';
            if (name.includes('punsch')) return '🍷';
            if (name.includes('tiramisu')) return '🍰';
            if (name.includes('kaiserschmarn')) return '🥞';
            if (name.includes('apfel')) return '🍎';
            if (name.includes('oatmeal') || name.includes('haferflocken')) return '🥣';
            if (name.includes('naan')) return '🫓';
            if (name.includes('mac')) return '🧀';
            
            return '🍽️';
        }

        function getRandomHeight(seed) {
            // Konsistente Höhe basierend auf Namen
            const hash = seed.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const heights = ['tall', 'short'];
            return heights[hash % heights.length];
        }

        function handleSearch(e) {
            const searchTerm = e.target.value;
            applyFilters(searchTerm, currentCategory);
        }

        function filterByCategory(category) {
            currentCategory = category;
            
            // Update active state
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.remove('active');
                if (chip.dataset.category === category) {
                    chip.classList.add('active');
                }
            });
            
            applyFilters(searchInput.value, category);
        }

        function applyFilters(searchTerm, category) {
            // Zuerst nach Kategorie filtern
            let recipes = category === 'Alle' ? allRecipes : generator.filterByCategory(category);
            
            // Dann nach Suchbegriff filtern
            if (searchTerm && searchTerm.trim() !== '') {
                const term = searchTerm.toLowerCase().trim();
                recipes = recipes.filter(recipe => 
                    recipe.name.toLowerCase().includes(term)
                );
            }
            
            filteredRecipes = recipes;
            displayRecipes();
        }

        function initializeCategoryFilter() {
            const categories = generator.getAllCategories();
            
            if (categories.length === 0) {
                categoryFilter.style.display = 'none';
                return;
            }
            
            // Prüfe ob Standard-Kategorie existiert
            const defaultCategoryExists = categories.includes(currentCategory);
            
            // Baue Category Chips
            let html = `<button class="category-chip ${!defaultCategoryExists ? 'active' : ''}" data-category="Alle" onclick="filterByCategory('Alle')">Alle</button>`;
            
            categories.forEach(category => {
                const escapedCategory = category.replace(/'/g, "\\'");
                const isActive = category === currentCategory && defaultCategoryExists ? 'active' : '';
                html += `<button class="category-chip ${isActive}" data-category="${category}" onclick="filterByCategory('${escapedCategory}')">${category}</button>`;
            });
            
            categoryFilter.innerHTML = html;
            categoryFilter.style.display = 'flex';
        }

        function selectRandomRecipe() {
            const random = generator.getRandomRecipe(filteredRecipes);
            if (random) {
                openRecipe(random.name);
            }
        }

        function shuffleRecipes() {
            // Fisher-Yates shuffle algorithm
            filteredRecipes = [...filteredRecipes];
            for (let i = filteredRecipes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredRecipes[i], filteredRecipes[j]] = [filteredRecipes[j], filteredRecipes[i]];
            }
            displayRecipes();
        }

        function openRecipe(recipeName) {
            // Speichere Rezeptname und öffne Detail-Seite
            localStorage.setItem('currentRecipe', recipeName);
            window.location.href = 'pages/recipe-detail.html';
        }


        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (document.activeElement !== searchInput) {
                    selectRandomRecipe();
                }
            }
        });
    </script>
    <script src="js/recipeEditor.js"></script>

    <style>
        .upload-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            z-index: 10000;
        }

        .upload-card {
            position: relative;
            height: fit-content;
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .upload-card h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .upload-card p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .upload-status {
            margin-top: 20px;
        }

        .upload-status .error {
            color: #d32f2f;
            padding: 15px;
            background: #ffebee;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
        }

        .upload-status .success {
            color: #388e3c;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #388e3c;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 8px 14px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            background: #667eea;
            color: white;
            border: none;
            width: 100%;
            text-align: center;
        }

        .file-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-label-back {
            background: #6c757d;
        }

        .file-label-back:hover {
            background: #5a6268;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .progress-container {
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .progress-text {
            color: #666;
            font-size: 0.9em;
        }

        /* Category Filter Styles */
        .category-filter {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: thin;
