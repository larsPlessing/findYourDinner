name: Rezept hinzufügen (Bild oder URL)

on:
  push:
    branches: [main]        # ggf. auf "master" ändern
    paths:
      - "inbox/**"          # Bilder und inbox/urls.txt
  workflow_dispatch:         # manuell startbar im Actions-Tab (auch in der GitHub-App)
    inputs:
      url:
        description: "Rezept-URL (optional)"
        required: false
        type: string

concurrency:
  group: add-recipe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rezepte extrahieren
        run: node scripts/add-recipe.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPE_URL: ${{ inputs.url }}
          # Optional:
          # GEMINI_MODEL: gemini-2.5-flash
          # RECIPES_FILE: data/recipes.json

      - name: Änderungen committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
            exit 0
          fi
          git commit -m "Neue Rezepte hinzugefügt"
          git pull --rebase
          git push
